repository: a3ws/MuC2025
title: A3WS – Accessibility in Mobility
email: "mathias.haimerl@thi.de"
description: "Accessible Automated Automotive Workshop Series (A3WS) – Accessibility in Mobility."

remote_theme: "mmistakes/minimal-mistakes@4.27.3"
minimal_mistakes_skin: contrast
search: true
baseurl: /MuC2025
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
#timezone: Europe/Berlin

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  bio: >-
    **A**ccessible **A**utomated **A**utomotive **W**orkshop **S**eries – **A**ccessibility **i**n **M**obility.
    *In conjunction with [MuC 2025](https://muc2025.mensch-und-computer.de/de/)*

announcement: "[Call for Contributions open **NOW**!](https://easychair.org/my/conference?conf=a3wsaim){: .align--left .btn .btn--info .btn--large }"

footer:
  links:
    - label: "Imprint"
      icon: "fa fa-fw fa-info"
      url: "/MuC2025/Imprint/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
